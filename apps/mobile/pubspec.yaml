name: appbancodesangue
description: >-
  Aplicativo educativo para doadores de sangue: guia, quiz, registro de doações
  e estimativa da próxima data apta. Projeto de Iniciação Científica (2023),
  modernizado em 2026.
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  material_ui: ^1.11.0

  # Architecture: MVVM with ChangeNotifier + provider for DI, go_router for
  # navigation (both recommended by docs.flutter.dev/app-architecture).
  provider: ^6.1.5+1
  go_router: ^18.1.4

  # Persistence and backend
  shared_preferences: ^2.5.6
  http: ^1.6.0
  # Session token in Keychain (iOS) / Keystore-backed storage (Android).
  flutter_secure_storage: ^11.2.0

  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
