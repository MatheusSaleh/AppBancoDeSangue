name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  api:
    name: API (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
      - name: Auditoria (dependências de produção)
        run: npm audit --omit=dev --audit-level=moderate

  api-docker:
    name: API (imagem Docker)
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t banco-de-sangue-api apps/api
      - name: Smoke test
        run: |
          docker run -d --name api -p 3000:3000 banco-de-sangue-api
          for i in $(seq 1 20); do curl -fs http://localhost:3000/health && break; sleep 1; done
          curl -fs -X POST http://localhost:3000/auth/register \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"senha-segura-123"}'
          docker rm -f api

  mobile:
    name: Mobile (formatação, análise e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formatação
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Análise estática
        run: flutter analyze
      - name: Testes
        run: flutter test --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage
          path: apps/mobile/coverage/lcov.info

  mobile-web:
    name: Mobile (build web de demonstração)
    needs: mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build web --release
      - uses: actions/upload-artifact@v7
        with:
          name: web-demo
          path: apps/mobile/build/web

  mobile-android:
    name: Mobile (APK de depuração)
    needs: mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
